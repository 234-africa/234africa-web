<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>234AFRICA - Events (Neon Grid)</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <link rel="stylesheet" href="style.css" />
  
  <style>
    body {
      background: #050505;
      margin: 0; padding: 0;
      font-family: 'Space Grotesk', sans-serif;
    }
    
    /* Force header links to be white on this dark page */
    .nav-links, .nav-links a { color: #fff !important; }

    .events-header {
      padding: 180px 40px 60px;
      text-align: center;
    }
    .events-title {
      font-family: var(--font-display);
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      margin: 0;
      line-height: 1;
    }
    .events-subtitle {
      color: #aaa;
      font-size: 1.2rem;
      margin-top: 15px;
      letter-spacing: 2px;
    }

    .events-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 40px;
      padding: 0 40px 100px;
      max-width: 1400px;
      margin: 0 auto;
    }

    .event-card {
      background: #111;
      border: 2px solid #333;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      transition: border-color 0.3s ease;
      transform-style: preserve-3d;
      perspective: 1000px;
    }

    .event-img-wrap {
      width: 100%;
      aspect-ratio: 4/5;
      overflow: hidden;
      border-bottom: 2px solid #333;
    }
    .event-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }

    .event-details {
      padding: 24px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .event-title {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 800;
      color: #fff;
      margin: 0 0 10px 0;
      text-transform: uppercase;
    }
    .event-meta {
      font-size: 1rem;
      color: #aaa;
      margin-bottom: 20px;
      font-weight: 600;
    }
    
    .event-btn {
      margin-top: auto;
      padding: 12px 24px;
      background: #222;
      color: #fff;
      text-align: center;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 0.9rem;
      border-radius: 100px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    /* NEON BRAND COLORS */
    .event-card.c-red:hover { border-color: var(--c-red); box-shadow: 0 10px 40px rgba(232, 65, 40, 0.4); }
    .event-card.c-red:hover .event-btn { background: var(--c-red); color: #fff; }
    .event-card.c-red .event-img-wrap { border-bottom-color: var(--c-red); }

    .event-card.c-green:hover { border-color: var(--c-green); box-shadow: 0 10px 40px rgba(16, 140, 90, 0.4); }
    .event-card.c-green:hover .event-btn { background: var(--c-green); color: #000; }
    .event-card.c-green .event-img-wrap { border-bottom-color: var(--c-green); }

    .event-card.c-yellow:hover { border-color: var(--c-yellow); box-shadow: 0 10px 40px rgba(244, 162, 24, 0.4); }
    .event-card.c-yellow:hover .event-btn { background: var(--c-yellow); color: #000; }
    .event-card.c-yellow .event-img-wrap { border-bottom-color: var(--c-yellow); }

    .event-card:hover .event-img { transform: scale(1.05); }

    @media (max-width: 768px) {
      .events-header { padding: 120px 20px 40px; }
      .events-grid { padding: 0 20px 60px; grid-template-columns: 1fr; gap: 30px; }
      .event-img-wrap { aspect-ratio: 1/1; }
      .event-card { transform: none !important; box-shadow: none !important; }
      
      /* Keep borders active on mobile since there is no hover */
      .event-card.c-red { border-color: var(--c-red); }
      .event-card.c-green { border-color: var(--c-green); }
      .event-card.c-yellow { border-color: var(--c-yellow); }
    }
  </style>
</head>
<body>

  <header id="header">
    <div class="header-inner">
      <a href="index.html" class="logo" style="display: flex; align-items: center; z-index: 999;">
        <img src="assets/234logo-transparent.png" alt="234AFRICA Logo" style="height: 40px; width: auto; object-fit: contain;">
      </a>
      <nav class="nav-links">
        <a href="ecosystem.html">THE ECOSYSTEM</a>
        <a href="events.html" style="color: var(--c-yellow) !important; text-decoration: underline;">EVENTS</a>
        <a href="https://greyapple.vip" target="_blank">GREYAPPLE</a>
        <a href="cruiseroom.html">THE CRUISE ROOM</a>
      </nav>
    </div>
  </header>

  <section class="events-header">
    <h1 class="events-title">Upcoming <span style="color: var(--c-red);">Events</span></h1>
    <p class="events-subtitle">Secure your tickets before they sell out.</p>
  </section>

  <section class="events-grid" id="events-grid">
    <!-- Populated by JS -->
  </section>

  <script>
    const events = [
      { title: "ON THE BEACH", date: "Dec 27, 2026 • Lagos", img: "assets/events-posters/poster-1.jpg", colorClass: "c-red", link: "https://greyapple.vip" },
      { title: "INDEPENDENCE", date: "Oct 4, 2026 • Landmark", img: "assets/events-posters/poster-2.jpg", colorClass: "c-green", link: "https://greyapple.vip" },
      { title: "ON THE ROOF", date: "Dec 17, 2026 • Rooftop VI", img: "assets/events-posters/poster-3.png", colorClass: "c-yellow", link: "https://greyapple.vip" },
      { title: "SUNDOWN", date: "Aug 8, 2026 • Lagos", img: "assets/events-posters/poster-4.jpg", colorClass: "c-red", link: "https://greyapple.vip" },
      { title: "CRUISE ROOM", date: "Dec 18, 2026 • The Hub", img: "assets/events-posters/poster-5.png", colorClass: "c-green", link: "cruiseroom.html" }
    ];

    const grid = document.getElementById('events-grid');

    events.forEach(ev => {
      const card = document.createElement('a');
      card.href = ev.link;
      card.className = `event-card ${ev.colorClass}`;
      card.innerHTML = `
        <div class="event-img-wrap">
          <img src="${ev.img}" alt="${ev.title}" class="event-img">
        </div>
        <div class="event-details">
          <h2 class="event-title">${ev.title}</h2>
          <div class="event-meta">${ev.date}</div>
          <div class="event-btn">GET TICKETS</div>
        </div>
      `;
      grid.appendChild(card);
    });

    // GSAP 3D Tilt Effect on Desktop
    if (window.innerWidth > 768) {
      const cards = document.querySelectorAll('.event-card');
      
      cards.forEach(card => {
        card.addEventListener('mousemove', (e) => {
          const rect = card.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;
          
          const centerX = rect.width / 2;
          const centerY = rect.height / 2;
          
          const rotateX = ((y - centerY) / centerY) * -10;
          const rotateY = ((x - centerX) / centerX) * 10;
          
          gsap.to(card, {
            rotationX: rotateX,
            rotationY: rotateY,
            transformPerspective: 1000,
            ease: 'power2.out',
            duration: 0.5
          });
        });

        card.addEventListener('mouseleave', () => {
          gsap.to(card, {
            rotationX: 0,
            rotationY: 0,
            ease: 'elastic.out(1, 0.3)',
            duration: 1
          });
        });
      });
    }
  </script>
</body>
</html>
