<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>234AFRICA — Events</title>
  <meta name="description" content="234AFRICA Events — Live from Lagos to the world." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,900&family=Space+Mono:ital,wght@0,400;0,700;1,700&display=swap" rel="stylesheet">

  <style>
    /* ════════════════════════════════════════════════════
       RESET & ROOT
    ════════════════════════════════════════════════════ */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #E84128;
      --display: 'Bricolage Grotesque', sans-serif;
      --mono: 'Space Mono', monospace;
    }
    html {
      height: 100%;
      background: #000;
    }
    body {
      height: 100svh;
      overflow: hidden;
      font-family: var(--display);
      background: #000;
      color: #fff;
      -webkit-font-smoothing: antialiased;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
    }

    /* ════════════════════════════════════════════════════
       CUSTOM CURSOR (Desktop Only)
    ════════════════════════════════════════════════════ */
    .cursor {
      position: fixed;
      width: 18px; height: 18px;
      border: 2px solid var(--accent);
      border-radius: 50%;
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      transition: border-color 0.4s, transform 0.1s, width 0.3s, height 0.3s;
      mix-blend-mode: difference;
    }
    .cursor.hovering { width: 60px; height: 60px; }
    @media (hover: none) { .cursor { display: none; } }

    /* ════════════════════════════════════════════════════
       CHROMATIC ABERRATION SCANLINE OVERLAY
    ════════════════════════════════════════════════════ */
    .scanlines {
      position: fixed; inset: 0; z-index: 10; pointer-events: none;
      background: repeating-linear-gradient(
        0deg,
        rgba(0,0,0,0) 0px, rgba(0,0,0,0) 2px,
        rgba(0,0,0,0.06) 2px, rgba(0,0,0,0.06) 3px
      );
    }
    /* Sweep line that scrolls down */
    .scanlines::after {
      content: '';
      position: absolute;
      left: 0; right: 0;
      height: 120px;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.04), transparent);
      animation: scanSweep 4s linear infinite;
    }
    @keyframes scanSweep {
      from { top: -120px; }
      to   { top: 100%; }
    }

    /* ════════════════════════════════════════════════════
       COLOR WASH — Full-page glow that shifts per event
    ════════════════════════════════════════════════════ */
    .color-wash {
      position: fixed; inset: 0; z-index: 1; pointer-events: none;
      background: var(--accent);
      opacity: 0.07;
      transition: background 0.9s cubic-bezier(0.16,1,0.3,1), opacity 0.9s;
      mix-blend-mode: screen;
    }

    /* ════════════════════════════════════════════════════
       STAGE — the full-screen flyer display
    ════════════════════════════════════════════════════ */
    .stage {
      position: fixed; inset: 0; z-index: 2;
      perspective: 1200px;
      perspective-origin: 50% 50%;
      overflow: hidden;
    }

    .flyer-slide {
      position: absolute; inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
    }
    .flyer-slide.active {
      opacity: 1;
      pointer-events: auto;
    }
    .flyer-slide img {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center top;
      /* Slight zoom-in that pulses */
      animation: imgBreath 8s ease-in-out infinite alternate;
    }
    @keyframes imgBreath {
      from { transform: scale(1.0); }
      to   { transform: scale(1.08); }
    }

    /* Dark vignette over the flyer so text is readable */
    .flyer-slide::after {
      content: '';
      position: absolute; inset: 0;
      background:
        linear-gradient(to top, rgba(0,0,0,0.97) 0%, rgba(0,0,0,0.3) 40%, rgba(0,0,0,0.15) 70%, rgba(0,0,0,0.5) 100%),
        linear-gradient(to right, rgba(0,0,0,0.6) 0%, transparent 40%);
      z-index: 1;
    }

    /* Transition states */
    .flyer-slide.exit-left {
      animation: exitLeft 0.65s cubic-bezier(0.77,0,0.18,1) forwards;
    }
    .flyer-slide.enter-right {
      animation: enterRight 0.65s cubic-bezier(0.77,0,0.18,1) forwards;
    }
    .flyer-slide.exit-right {
      animation: exitRight 0.65s cubic-bezier(0.77,0,0.18,1) forwards;
    }
    .flyer-slide.enter-left {
      animation: enterLeft 0.65s cubic-bezier(0.77,0,0.18,1) forwards;
    }

    @keyframes exitLeft {
      from { opacity:1; transform: rotateY(0deg) scale(1) translateX(0); }
      to   { opacity:0; transform: rotateY(-25deg) scale(0.7) translateX(-20%); }
    }
    @keyframes enterRight {
      from { opacity:0; transform: rotateY(25deg) scale(0.7) translateX(20%); }
      to   { opacity:1; transform: rotateY(0deg) scale(1) translateX(0); }
    }
    @keyframes exitRight {
      from { opacity:1; transform: rotateY(0deg) scale(1) translateX(0); }
      to   { opacity:0; transform: rotateY(25deg) scale(0.7) translateX(20%); }
    }
    @keyframes enterLeft {
      from { opacity:0; transform: rotateY(-25deg) scale(0.7) translateX(-20%); }
      to   { opacity:1; transform: rotateY(0deg) scale(1) translateX(0); }
    }

    /* ════════════════════════════════════════════════════
       GLITCH FLASH — fires on transition
    ════════════════════════════════════════════════════ */
    .glitch-flash {
      position: fixed; inset: 0; z-index: 50; pointer-events: none;
      background: var(--accent);
      opacity: 0;
    }
    .glitch-flash.fire {
      animation: flashBurst 0.4s steps(3) forwards;
    }
    @keyframes flashBurst {
      0%   { opacity: 0.35; }
      33%  { opacity: 0; }
      66%  { opacity: 0.2; }
      100% { opacity: 0; }
    }

    /* ════════════════════════════════════════════════════
       HEADER
    ════════════════════════════════════════════════════ */
    .site-header {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      padding: 18px 32px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .site-header .logo img { height: 32px; }
    .nav-links {
      display: flex; gap: 20px;
      font-family: var(--mono);
      font-size: 0.6rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    .nav-links a {
      color: rgba(255,255,255,0.5);
      text-decoration: none;
      transition: color 0.2s;
    }
    .nav-links a:hover, .nav-links a.active { color: #fff; }
    .nav-links a.active { color: var(--accent); }

    /* ════════════════════════════════════════════════════
       BOTTOM INFO PANEL
    ════════════════════════════════════════════════════ */
    .info-panel {
      position: fixed;
      bottom: 0; left: 0; right: 0; z-index: 50;
      padding: 32px 40px 40px;
      pointer-events: none;
    }

    /* Counter pill at top of info */
    .event-counter {
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.4);
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .counter-current {
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      font-family: var(--mono);
      display: inline-block;
      min-width: 2ch;
    }
    .counter-total { color: rgba(255,255,255,0.25); }

    /* Big event title */
    .event-name {
      font-family: var(--display);
      font-size: clamp(2.2rem, 8vw, 6rem);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -2px;
      line-height: 0.9;
      margin-bottom: 16px;
      /* Clip text reveal */
      clip-path: inset(0 100% 0 0);
      transition: clip-path 0s;
    }
    .event-name.revealed {
      animation: textReveal 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
    }
    @keyframes textReveal {
      from { clip-path: inset(0 100% 0 0); }
      to   { clip-path: inset(0 0% 0 0); }
    }

    /* Meta row */
    .event-meta-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-bottom: 24px;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.4s 0.3s, transform 0.4s 0.3s;
    }
    .event-meta-row.visible {
      opacity: 1;
      transform: translateY(0);
    }
    .meta-chip {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.12em;
      color: rgba(255,255,255,0.55);
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 6px 14px;
      border-radius: 2px;
      text-transform: uppercase;
    }
    .meta-chip.accent-chip {
      background: var(--accent);
      border-color: var(--accent);
      color: #000;
      font-weight: 700;
    }

    /* CTA row */
    .cta-row {
      display: flex;
      align-items: center;
      gap: 20px;
      pointer-events: auto;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.4s 0.45s, transform 0.4s 0.45s;
    }
    .cta-row.visible { opacity: 1; transform: translateY(0); }

    .btn-primary {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--display);
      font-weight: 900;
      font-size: 0.9rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      color: #000;
      background: var(--accent);
      padding: 16px 36px;
      border-radius: 3px;
      transition: transform 0.2s, opacity 0.2s;
      border: none; cursor: pointer;
    }
    .btn-primary:hover { transform: scale(1.04); opacity: 0.9; }

    .btn-ghost {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      transition: color 0.2s;
      border: none; background: none; cursor: pointer;
    }
    .btn-ghost:hover { color: #fff; }

    /* ════════════════════════════════════════════════════
       RIGHT SIDE: Event thumbnail strip (vertical)
    ════════════════════════════════════════════════════ */
    .thumb-strip {
      position: fixed;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: auto;
    }
    .thumb-btn {
      width: 44px; height: 60px;
      border-radius: 4px;
      overflow: hidden;
      border: 2px solid rgba(255,255,255,0.1);
      cursor: pointer;
      transition: border-color 0.3s, transform 0.3s, opacity 0.3s;
      opacity: 0.4;
      background: none; padding: 0;
    }
    .thumb-btn img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: center top;
      display: block;
    }
    .thumb-btn.active {
      border-color: var(--accent);
      opacity: 1;
      transform: scale(1.1);
    }
    .thumb-btn:hover:not(.active) { opacity: 0.7; }

    /* ════════════════════════════════════════════════════
       ARROW NAVIGATION (Desktop)
    ════════════════════════════════════════════════════ */
    .nav-arrows {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      z-index: 100;
      display: flex;
      flex-direction: column;
      gap: 0;
      left: 20px;
    }
    .nav-arrow {
      width: 48px; height: 48px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
      color: rgba(255,255,255,0.3);
      cursor: pointer;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 3px;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(10px);
      transition: color 0.2s, border-color 0.2s, background 0.2s;
      margin-bottom: 6px;
      line-height: 1;
      user-select: none;
    }
    .nav-arrow:hover {
      color: #fff;
      border-color: var(--accent);
      background: rgba(0,0,0,0.7);
    }

    /* ════════════════════════════════════════════════════
       STATUS BAR (Top right — status + tagline)
    ════════════════════════════════════════════════════ */
    .status-bar {
      position: fixed;
      top: 80px; right: 90px; /* to the left of thumb strip */
      z-index: 100;
      text-align: right;
      pointer-events: none;
    }
    .status-badge {
      display: inline-block;
      font-family: var(--mono);
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.2em;
      padding: 5px 12px;
      border-radius: 2px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .badge-upcoming { background: var(--accent); color: #000; }
    .badge-past     { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.35); border: 1px solid rgba(255,255,255,0.1); }
    .event-tagline-top {
      font-family: var(--mono);
      font-size: 0.6rem;
      color: rgba(255,255,255,0.3);
      letter-spacing: 0.1em;
      max-width: 240px;
      line-height: 1.6;
    }

    /* ════════════════════════════════════════════════════
       SWIPE HINT (Mobile)
    ════════════════════════════════════════════════════ */
    .swipe-hint {
      position: fixed;
      bottom: 160px; left: 50%; transform: translateX(-50%);
      z-index: 100;
      font-family: var(--mono);
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      color: rgba(255,255,255,0.25);
      text-transform: uppercase;
      display: flex; align-items: center; gap: 8px;
      animation: hintFade 3s ease-in-out 2s forwards;
      pointer-events: none;
    }
    @keyframes hintFade {
      0%   { opacity: 1; }
      80%  { opacity: 1; }
      100% { opacity: 0; }
    }
    @media (hover: hover) { .swipe-hint { display: none; } }

    /* ════════════════════════════════════════════════════
       MOBILE ADJUSTMENTS
    ════════════════════════════════════════════════════ */
    @media (max-width: 768px) {
      .site-header { padding: 14px 20px; }
      .nav-links { gap: 12px; font-size: 0.5rem; }
      .thumb-strip { display: none; } /* On mobile, swipe is the nav */
      .nav-arrows  { display: none; }
      .status-bar  { right: 20px; }
      .info-panel  { padding: 24px 20px 100px; }
      .event-name  { letter-spacing: -1px; }

      /* Mobile dot nav instead */
      .dot-nav {
        position: fixed;
        bottom: 60px; left: 50%; transform: translateX(-50%);
        z-index: 100;
        display: flex; gap: 10px;
        pointer-events: auto;
      }
      .dot {
        width: 6px; height: 6px;
        border-radius: 50%;
        background: rgba(255,255,255,0.25);
        cursor: pointer;
        transition: background 0.3s, width 0.3s;
        border: none;
      }
      .dot.active {
        background: var(--accent);
        width: 24px;
        border-radius: 3px;
      }
    }
    @media (min-width: 769px) {
      .dot-nav { display: none; }
      .swipe-hint { display: none; }
    }
  </style>
</head>
<body>

  <!-- CURSOR -->
  <div class="cursor" id="cursor"></div>

  <!-- SCANLINES -->
  <div class="scanlines" aria-hidden="true"></div>

  <!-- GLITCH FLASH -->
  <div class="glitch-flash" id="glitchFlash" aria-hidden="true"></div>

  <!-- COLOR WASH -->
  <div class="color-wash" id="colorWash" aria-hidden="true"></div>

  <!-- HEADER -->
  <header class="site-header">
    <a href="index.html" class="logo"><img src="assets/234logo-transparent.png" alt="234AFRICA"></a>
    <nav class="nav-links">
      <a href="ecosystem.html">ECOSYSTEM</a>
      <a href="events.html" class="active">EVENTS</a>
      <a href="https://greyapple.vip" target="_blank">GREYAPPLE</a>
      <a href="cruiseroom.html">CRUISE ROOM</a>
    </nav>
  </header>

  <!-- STATUS BAR -->
  <div class="status-bar" id="statusBar">
    <div class="status-badge badge-upcoming" id="statusBadge">UPCOMING</div>
    <p class="event-tagline-top" id="taglineTop"></p>
  </div>

  <!-- STAGE -->
  <div class="stage" id="stage"></div>

  <!-- THUMB STRIP -->
  <div class="thumb-strip" id="thumbStrip"></div>

  <!-- LEFT ARROWS -->
  <div class="nav-arrows">
    <button class="nav-arrow" id="btnPrev" aria-label="Previous event">↑</button>
    <button class="nav-arrow" id="btnNext" aria-label="Next event">↓</button>
  </div>

  <!-- MOBILE DOTS -->
  <div class="dot-nav" id="dotNav"></div>

  <!-- SWIPE HINT -->
  <div class="swipe-hint">← SWIPE →</div>

  <!-- INFO PANEL -->
  <div class="info-panel" id="infoPanel">
    <div class="event-counter">
      <span class="counter-current" id="counterCurrent">01</span>
      <span class="counter-sep">/</span>
      <span class="counter-total">06</span>
    </div>
    <div class="event-name" id="eventName">CRUISE CONTROL</div>
    <div class="event-meta-row" id="metaRow"></div>
    <div class="cta-row" id="ctaRow"></div>
  </div>

  <script>
  /* ════════════════════════════════════════════════
     EVENT DATA
  ════════════════════════════════════════════════ */
  const EVENTS = [
    {
      title: 'CRUISE CONTROL',
      img: 'assets/flyers/cruise-control-2025.png',
      accent: '#F4A218',
      status: 'upcoming',
      tagline: 'The biggest night of the year. Lagos goes supersonic.',
      chips: ['DEC 18, 2025','SOL BEACH · LAGOS','AFROBEATS · AMAPIANO · AFROHOUSE'],
      accentChip: 'UPCOMING',
      cta: { label: 'GET TICKETS', href: 'https://234tickets.live/event/cc', external: true },
    },
    {
      title: 'CRUISE ROOM',
      img: 'assets/flyers/cruise-room.png',
      accent: '#E84128',
      status: 'past',
      tagline: 'Where Lagos meets the world — for creatives, by creatives.',
      chips: ['DEC 18, 2024','BATURE BREWERY · V.I.','MEDIA · MUSIC · BUSINESS'],
      accentChip: null,
      cta: { label: 'VIEW RECAP', href: 'cruiseroom.html', external: false },
    },
    {
      title: '+234 ON THE BEACH',
      img: 'assets/flyers/on-the-beach.jpg',
      accent: '#00C8D4',
      status: 'past',
      tagline: 'Day shift til night shift. Villa Eduardo, Ilashe. Sun, sand, sound.',
      chips: ['DEC 27, 2024','VILLA EDUARDO · ILASHE','HOST: DJ PHIL'],
      accentChip: null,
      cta: { label: 'VIEW RECAP', href: '#', external: false },
    },
    {
      title: '+234 SOUNDSYSTEM',
      img: 'assets/flyers/soundsystem.jpg',
      accent: '#3DBA6F',
      status: 'past',
      tagline: 'Independence Day Party. Nigeria's night at Clubhouse, Landmark.',
      chips: ['OCT 4','CLUBHOUSE · LANDMARK','DJ PHIL & FRIENDS · 8PM'],
      accentChip: null,
      cta: { label: 'VIEW RECAP', href: '#', external: false },
    },
    {
      title: '+234 SUNDOWN ON SUMMER',
      img: 'assets/flyers/sundown-on-summer.jpg',
      accent: '#FF9B1A',
      status: 'past',
      tagline: 'The sun went down. The bass rolled in. Engine Room Lagos on fire.',
      chips: ['AUG 8TH','ENGINE ROOM LAGOS','DJ PHIL & FRIENDS · 10PM'],
      accentChip: null,
      cta: { label: 'VIEW RECAP', href: '#', external: false },
    },
    {
      title: '+234 ON THE ROOF',
      img: 'assets/flyers/on-the-roof.png',
      accent: '#9B5CF6',
      status: 'past',
      tagline: 'Boarding pass: ALL BLACK. Afrobeats & Amapiano from the rooftop.',
      chips: ['DEC 17, 2022','NO 5 BAR · LEKKI PHASE 1','DJ PHIL · 7PM'],
      accentChip: null,
      cta: { label: 'VIEW RECAP', href: '#', external: false },
    },
  ];

  /* ════════════════════════════════════════════════
     INIT DOM
  ════════════════════════════════════════════════ */
  const stage      = document.getElementById('stage');
  const thumbStrip = document.getElementById('thumbStrip');
  const dotNav     = document.getElementById('dotNav');

  // Build slides
  EVENTS.forEach((ev, i) => {
    const slide = document.createElement('div');
    slide.className = 'flyer-slide' + (i === 0 ? ' active' : '');
    slide.dataset.index = i;
    slide.innerHTML = `<img src="${ev.img}" alt="${ev.title}" loading="${i === 0 ? 'eager' : 'lazy'}">`;
    stage.appendChild(slide);

    // Thumbs (desktop)
    const btn = document.createElement('button');
    btn.className = 'thumb-btn' + (i === 0 ? ' active' : '');
    btn.dataset.index = i;
    btn.innerHTML = `<img src="${ev.img}" alt="${ev.title}">`;
    btn.addEventListener('click', () => goTo(i));
    thumbStrip.appendChild(btn);

    // Dots (mobile)
    const dot = document.createElement('button');
    dot.className = 'dot' + (i === 0 ? ' active' : '');
    dot.dataset.index = i;
    dot.addEventListener('click', () => goTo(i));
    dotNav.appendChild(dot);
  });

  /* ════════════════════════════════════════════════
     STATE & NAVIGATION
  ════════════════════════════════════════════════ */
  let current = 0;
  let isAnimating = false;

  function goTo(next, direction = 'forward') {
    if (next === current || isAnimating) return;
    isAnimating = true;

    const prev = current;
    current = next;
    const dir = direction === 'forward' || next > prev ? 'forward' : 'backward';

    const slides = document.querySelectorAll('.flyer-slide');
    const thumbs = document.querySelectorAll('.thumb-btn');
    const dots   = document.querySelectorAll('.dot');

    // Trigger glitch flash
    const flash = document.getElementById('glitchFlash');
    flash.classList.add('fire');
    setTimeout(() => flash.classList.remove('fire'), 400);

    // Animate out old slide
    const oldSlide = slides[prev];
    oldSlide.classList.remove('active');
    oldSlide.classList.add(dir === 'forward' ? 'exit-left' : 'exit-right');

    // Animate in new slide
    const newSlide = slides[next];
    newSlide.style.opacity = '0';
    newSlide.classList.add(dir === 'forward' ? 'enter-right' : 'enter-left');

    setTimeout(() => {
      newSlide.style.opacity = '';
      newSlide.classList.add('active');
    }, 50);

    // Update thumbs & dots
    thumbs.forEach((t, i) => t.classList.toggle('active', i === next));
    dots.forEach((d, i) => d.classList.toggle('active', i === next));

    // Update color wash & CSS var
    const ev = EVENTS[next];
    document.getElementById('colorWash').style.background = ev.accent;
    document.documentElement.style.setProperty('--accent', ev.accent);

    // Update info panel — first hide
    const nameEl  = document.getElementById('eventName');
    const metaRow = document.getElementById('metaRow');
    const ctaRow  = document.getElementById('ctaRow');
    const counter = document.getElementById('counterCurrent');
    const badge   = document.getElementById('statusBadge');
    const tagline = document.getElementById('taglineTop');

    nameEl.classList.remove('revealed');
    metaRow.classList.remove('visible');
    ctaRow.classList.remove('visible');

    setTimeout(() => {
      // Update counter with slot-machine roll
      animateCounter(counter, String(next + 1).padStart(2, '0'));

      // Update text
      nameEl.textContent = ev.title;
      nameEl.classList.add('revealed');

      // Status badge
      badge.textContent = ev.status === 'upcoming' ? 'UPCOMING' : 'PAST EVENT';
      badge.className = 'status-badge ' + (ev.status === 'upcoming' ? 'badge-upcoming' : 'badge-past');
      tagline.textContent = ev.tagline;

      // Chips
      metaRow.innerHTML = '';
      ev.chips.forEach(c => {
        const chip = document.createElement('span');
        chip.className = 'meta-chip';
        chip.textContent = c;
        metaRow.appendChild(chip);
      });
      if (ev.accentChip) {
        const chip = document.createElement('span');
        chip.className = 'meta-chip accent-chip';
        chip.textContent = ev.accentChip;
        metaRow.appendChild(chip);
      }
      metaRow.classList.add('visible');

      // CTA
      ctaRow.innerHTML = '';
      const aEl = document.createElement('a');
      aEl.className = 'btn-primary';
      aEl.href = ev.cta.href;
      aEl.textContent = ev.cta.label + ' →';
      if (ev.cta.external) aEl.target = '_blank';
      ctaRow.appendChild(aEl);

      ctaRow.classList.add('visible');

    }, 200);

    // Cleanup animation classes after done
    setTimeout(() => {
      oldSlide.classList.remove('exit-left', 'exit-right');
      newSlide.classList.remove('enter-right', 'enter-left');
      isAnimating = false;
    }, 700);
  }

  function next() {
    goTo((current + 1) % EVENTS.length, 'forward');
  }
  function prev() {
    goTo((current - 1 + EVENTS.length) % EVENTS.length, 'backward');
  }

  // Slot-machine counter animation
  function animateCounter(el, targetStr) {
    let i = 0;
    const chars = '0123456789';
    const interval = setInterval(() => {
      el.textContent = chars[Math.floor(Math.random() * chars.length)] + chars[Math.floor(Math.random() * chars.length)];
      i++;
      if (i > 6) { clearInterval(interval); el.textContent = targetStr; }
    }, 40);
  }

  /* ════════════════════════════════════════════════
     KEYBOARD
  ════════════════════════════════════════════════ */
  document.addEventListener('keydown', e => {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next();
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   prev();
  });

  /* ════════════════════════════════════════════════
     MOUSE WHEEL
  ════════════════════════════════════════════════ */
  let wheelCooldown = false;
  document.addEventListener('wheel', e => {
    if (wheelCooldown) return;
    wheelCooldown = true;
    if (e.deltaY > 30) next();
    else if (e.deltaY < -30) prev();
    setTimeout(() => { wheelCooldown = false; }, 800);
  }, { passive: true });

  /* ════════════════════════════════════════════════
     TOUCH SWIPE
  ════════════════════════════════════════════════ */
  let touchStartX = 0, touchStartY = 0;
  document.addEventListener('touchstart', e => {
    touchStartX = e.touches[0].clientX;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });
  document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    const dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 40) {
      if (dx < 0) next(); else prev();
    }
    if (Math.abs(dy) > Math.abs(dx) && Math.abs(dy) > 40) {
      if (dy < 0) next(); else prev();
    }
  }, { passive: true });

  /* ════════════════════════════════════════════════
     BUTTON NAV
  ════════════════════════════════════════════════ */
  document.getElementById('btnPrev').addEventListener('click', prev);
  document.getElementById('btnNext').addEventListener('click', next);

  /* ════════════════════════════════════════════════
     CURSOR TRACKER (desktop)
  ════════════════════════════════════════════════ */
  const cursor = document.getElementById('cursor');
  document.addEventListener('mousemove', e => {
    cursor.style.left = e.clientX + 'px';
    cursor.style.top  = e.clientY + 'px';
  });
  document.querySelectorAll('a, button, .thumb-btn').forEach(el => {
    el.addEventListener('mouseenter', () => cursor.classList.add('hovering'));
    el.addEventListener('mouseleave', () => cursor.classList.remove('hovering'));
  });

  /* ════════════════════════════════════════════════
     INIT — Populate first event info
  ════════════════════════════════════════════════ */
  (function init() {
    const ev = EVENTS[0];
    document.getElementById('eventName').textContent = ev.title;
    document.getElementById('eventName').classList.add('revealed');
    document.getElementById('taglineTop').textContent = ev.tagline;
    document.documentElement.style.setProperty('--accent', ev.accent);
    document.getElementById('colorWash').style.background = ev.accent;

    const metaRow = document.getElementById('metaRow');
    ev.chips.forEach(c => {
      const chip = document.createElement('span');
      chip.className = 'meta-chip';
      chip.textContent = c;
      metaRow.appendChild(chip);
    });
    setTimeout(() => metaRow.classList.add('visible'), 300);

    const ctaRow = document.getElementById('ctaRow');
    const aEl = document.createElement('a');
    aEl.className = 'btn-primary';
    aEl.href = ev.cta.href;
    aEl.textContent = ev.cta.label + ' →';
    if (ev.cta.external) aEl.target = '_blank';
    ctaRow.appendChild(aEl);
    setTimeout(() => ctaRow.classList.add('visible'), 450);

    // Auto-advance every 8 seconds
    let autoTimer = setInterval(next, 8000);
    // Reset timer on any interaction
    function resetAuto() { clearInterval(autoTimer); autoTimer = setInterval(next, 8000); }
    document.getElementById('btnPrev').addEventListener('click', resetAuto);
    document.getElementById('btnNext').addEventListener('click', resetAuto);
    document.querySelectorAll('.thumb-btn, .dot').forEach(b => b.addEventListener('click', resetAuto));
    document.addEventListener('keydown', resetAuto);
    document.addEventListener('touchend', resetAuto, { passive: true });
  })();
  </script>

</body>
</html>
