<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>234AFRICA - Events (The Filmstrip)</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800;12..96,900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  <link rel="stylesheet" href="style.css" />
  
  <style>
    body {
      background: #050505;
      margin: 0; padding: 0;
      font-family: 'Space Grotesk', sans-serif;
      overflow-x: hidden;
      transition: background-color 0.8s ease;
    }
    
    /* Force header links to be white on this dark page */
    .nav-links, .nav-links a { color: #fff !important; }

    /* The pinning container */
    .pin-container {
      width: 100%;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* The horizontal moving track */
    .scroll-track {
      display: flex;
      width: max-content;
      height: 100%;
      padding-top: 80px; /* offset for header */
    }

    .event-panel {
      width: 100vw;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5vw;
      position: relative;
    }

    .panel-content {
      display: flex;
      width: 100%;
      max-width: 1400px;
      align-items: center;
      justify-content: space-between;
      gap: 40px;
    }

    /* LEFT: Crazy Typography */
    .panel-left {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    
    .event-title {
      font-family: var(--font-display);
      font-size: clamp(4rem, 10vw, 12rem);
      font-weight: 900;
      line-height: 0.85;
      text-transform: uppercase;
      color: transparent;
      -webkit-text-stroke: 2px #fff;
      margin: 0;
      position: relative;
    }
    .event-title::before {
      content: attr(data-text);
      position: absolute;
      left: 0; top: 0;
      width: 0%;
      color: #fff;
      -webkit-text-stroke: 0px;
      overflow: hidden;
      transition: width 0.5s ease;
      white-space: nowrap;
    }
    .event-panel:hover .event-title::before {
      width: 100%;
    }

    .event-meta {
      font-size: 1.5rem;
      color: rgba(255,255,255,0.7);
      margin-top: 20px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    .event-btn {
      margin-top: 40px;
      display: inline-block;
      padding: 15px 40px;
      background: #fff;
      color: #000;
      font-family: var(--font-display);
      font-weight: 900;
      font-size: 1.2rem;
      border-radius: 100px;
      text-decoration: none;
      text-transform: uppercase;
      transition: transform 0.3s ease;
      width: fit-content;
    }
    .event-btn:hover {
      transform: scale(1.05);
    }

    /* RIGHT: Clear Uncropped Poster */
    .panel-right {
      flex: 1;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      perspective: 1000px;
    }
    
    .poster-wrap {
      width: 100%;
      max-width: 500px;
      height: 70vh;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.8);
      border: 4px solid #fff;
      transition: transform 0.5s ease, box-shadow 0.5s ease;
    }
    
    .event-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #000;
    }

    .event-panel:hover .poster-wrap {
      transform: rotateY(-10deg) rotateX(5deg) scale(1.02);
    }

    /* BRAND COLORS DYNAMIC INJECTION VIA JS */
    /* Mobile Fallback: Vertical Snap */
    @media (max-width: 992px) {
      .pin-container { height: auto; overflow: visible; }
      .scroll-track { flex-direction: column; width: 100%; padding-top: 0; }
      .event-panel { height: 100vh; flex-direction: column; padding: 100px 20px 20px; scroll-snap-align: start; }
      .panel-content { flex-direction: column; gap: 20px; text-align: center; }
      .panel-left { align-items: center; }
      .event-title { -webkit-text-stroke: 1px #fff; font-size: 4rem; }
      .panel-right { justify-content: center; width: 100%; }
      .poster-wrap { height: 50vh; border-width: 2px; }
      html { scroll-snap-type: y mandatory; }
      .event-title::before { width: 100%; }
    }
  </style>
</head>
<body>

  <header id="header">
    <div class="header-inner">
      <a href="index.html" class="logo" style="display: flex; align-items: center; z-index: 999;">
        <img src="assets/234logo-transparent.png" alt="234AFRICA Logo" style="height: 40px; width: auto; object-fit: contain;">
      </a>
      <nav class="nav-links">
        <a href="ecosystem.html">THE ECOSYSTEM</a>
        <a href="events.html" style="color: var(--c-yellow) !important; text-decoration: underline;">EVENTS</a>
        <a href="https://greyapple.vip" target="_blank">GREYAPPLE</a>
        <a href="cruiseroom.html">THE CRUISE ROOM</a>
      </nav>
    </div>
  </header>

  <div class="pin-container" id="pinMaster">
    <div class="scroll-track" id="scrollTrack">
      <!-- Populated by JS -->
    </div>
  </div>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    const events = [
      { title: "ON THE BEACH", date: "Dec 27, 2026 • Lagos", img: "assets/events-posters/poster-1.jpg", bgColor: "#E84128", link: "https://greyapple.vip" },
      { title: "INDEPENDENCE", date: "Oct 4, 2026 • Landmark", img: "assets/events-posters/poster-2.jpg", bgColor: "#108C5A", link: "https://greyapple.vip" },
      { title: "ON THE ROOF", date: "Dec 17, 2026 • Rooftop VI", img: "assets/events-posters/poster-3.png", bgColor: "#F4A218", link: "https://greyapple.vip" },
      { title: "SUNDOWN", date: "Aug 8, 2026 • Lagos", img: "assets/events-posters/poster-4.jpg", bgColor: "#E84128", link: "https://greyapple.vip" },
      { title: "CRUISE ROOM", date: "Dec 18, 2026 • The Hub", img: "assets/events-posters/poster-5.png", bgColor: "#108C5A", link: "cruiseroom.html" }
    ];

    const track = document.getElementById('scrollTrack');

    events.forEach((ev, i) => {
      const panel = document.createElement('div');
      panel.className = 'event-panel';
      panel.setAttribute('data-color', ev.bgColor);
      
      panel.innerHTML = `
        <div class="panel-content">
          <div class="panel-left">
            <h2 class="event-title" data-text="${ev.title}">${ev.title}</h2>
            <div class="event-meta">${ev.date}</div>
            <a href="${ev.link}" class="event-btn">GET TICKETS</a>
          </div>
          <div class="panel-right">
            <div class="poster-wrap">
              <img src="${ev.img}" alt="${ev.title}" class="event-img">
            </div>
          </div>
        </div>
      `;
      track.appendChild(panel);
    });

    const panels = gsap.utils.toArray('.event-panel');

    // Desktop Horizontal Scroll
    if (window.innerWidth > 992) {
      let scrollTween = gsap.to(panels, {
        xPercent: -100 * (panels.length - 1),
        ease: "none",
        scrollTrigger: {
          trigger: "#pinMaster",
          pin: true,
          scrub: 1,
          snap: 1 / (panels.length - 1),
          end: () => "+=" + track.offsetWidth
        }
      });

      // Background color change logic for desktop
      panels.forEach((panel, i) => {
        ScrollTrigger.create({
          trigger: panel,
          containerAnimation: scrollTween,
          start: "left center",
          end: "right center",
          onEnter: () => gsap.to('body', { backgroundColor: panel.getAttribute('data-color'), duration: 0.5 }),
          onEnterBack: () => gsap.to('body', { backgroundColor: panel.getAttribute('data-color'), duration: 0.5 })
        });
      });
      
      // Initial color
      gsap.set('body', { backgroundColor: events[0].bgColor });

    } else {
      // Mobile Vertical Scroll Background morphing
      panels.forEach((panel, i) => {
        ScrollTrigger.create({
          trigger: panel,
          start: "top center",
          end: "bottom center",
          onEnter: () => gsap.to('body', { backgroundColor: panel.getAttribute('data-color'), duration: 0.5 }),
          onEnterBack: () => gsap.to('body', { backgroundColor: panel.getAttribute('data-color'), duration: 0.5 })
        });
      });
      // Initial color
      gsap.set('body', { backgroundColor: events[0].bgColor });
    }
  </script>
</body>
</html>
