<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>234AFRICA - Events</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800;12..96,900&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>
  
  <link rel="stylesheet" href="style.css" />
  
  <style>
    body {
      background: #000;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      overflow-x: hidden;
      margin: 0; padding: 0;
      /* Dynamic background container */
      transition: background 0.5s ease;
    }
    
    /* Dynamic ambient glow */
    .ambient-glow {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 150vw; height: 150vh;
      background: radial-gradient(circle at center, rgba(232, 65, 40, 0.15) 0%, rgba(0,0,0,0) 60%);
      z-index: -1;
      pointer-events: none;
      filter: blur(100px);
      transition: background 0.5s ease;
    }

    #header { background: transparent !important; border-bottom: none !important; z-index: 999; }
    .nav-links, .nav-links a { color: #fff !important; text-shadow: 0 2px 10px rgba(0,0,0,0.8); }

    .page-title {
      font-family: var(--font-display);
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 900;
      text-align: center;
      padding: 120px 20px 40px;
      margin: 0;
      text-transform: uppercase;
      letter-spacing: -2px;
    }

    /* THE STACKING DECK */
    .deck-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 200px;
      position: relative;
    }

    .event-card {
      position: sticky;
      /* Center it on screen: top offset = (100vh - card height) / 2 */
      top: 15vh; 
      width: 90vw;
      max-width: 450px;
      height: 70vh;
      margin-bottom: 100vh; /* Massive margin forces scrolling to reach next card */
      perspective: 1000px;
      will-change: transform;
    }
    .event-card:last-child {
      margin-bottom: 20vh;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 24px;
      overflow: hidden;
      box-shadow: 0 30px 60px rgba(0,0,0,0.6);
      transform-origin: top center;
      /* Border matches dynamic color */
      border: 1px solid rgba(255,255,255,0.1);
      background: #111;
    }

    .card-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: contrast(110%) saturate(120%);
    }

    .card-info {
      position: absolute;
      bottom: 0; left: 0;
      width: 100%;
      background: linear-gradient(to top, rgba(0,0,0,0.9) 0%, rgba(0,0,0,0.6) 60%, transparent 100%);
      padding: 40px 30px 30px;
      box-sizing: border-box;
      backdrop-filter: blur(5px);
      -webkit-backdrop-filter: blur(5px);
    }

    .card-title {
      font-family: var(--font-display);
      font-size: clamp(2rem, 6vw, 3rem);
      font-weight: 900;
      margin: 0 0 10px 0;
      line-height: 1;
      text-transform: uppercase;
      text-shadow: 0 0 15px currentColor;
    }

    .card-date {
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.7);
      margin: 0;
    }

  </style>
</head>
<body>

  <div class="ambient-glow" id="ambient-glow"></div>

  <header id="header">
    <div class="header-inner">
      <a href="index.html" class="logo" style="display: flex; align-items: center; z-index: 999;">
        <img src="assets/234logo-transparent.png" alt="234AFRICA Logo" style="height: 40px; width: auto; object-fit: contain;">
      </a>
      <nav class="nav-links">
        <a href="ecosystem.html">THE ECOSYSTEM</a>
        <a href="events.html" style="color: var(--c-red) !important; text-decoration: underline;">EVENTS</a>
        <a href="https://greyapple.vip" target="_blank">GREYAPPLE</a>
        <a href="cruiseroom.html">THE CRUISE ROOM</a>
      </nav>
    </div>
  </header>

  <h1 class="page-title">THE ARCHIVE</h1>

  <div class="deck-container" id="deck">
    <!-- Cards will be injected via JS -->
  </div>

  <script>
    gsap.registerPlugin(ScrollTrigger);

    const events = [
      { id: 1, title: 'GENZ FEST 2023', date: 'LAGOS - DEC 2023', img: 'assets/events/event-1.jpg', color: '#E84128' },
      { id: 2, title: 'THE SOUNDCLASH', date: 'ACCRA - NOV 2023', img: 'assets/events/event-2.jpg', color: '#F4A218' },
      { id: 3, title: 'CULTURE RAVE', date: 'ABUJA - OCT 2023', img: 'assets/events/event-3.png', color: '#108C5A' },
      { id: 4, title: 'MIDNIGHT CRUISE', date: 'LAGOS - SEPT 2023', img: 'assets/events/event-5.jpg', color: '#E84128' },
      { id: 5, title: 'BLOCK PARTY', date: 'LONDON - AUG 2023', img: 'assets/events/event-6.jpg', color: '#F4A218' },
      { id: 6, title: 'VIBES ON VIBES', date: 'PARIS - JULY 2023', img: 'assets/events/event-9.jpg', color: '#108C5A' }
    ];

    const deck = document.getElementById('deck');
    const glow = document.getElementById('ambient-glow');

    // Build the DOM
    events.forEach((ev, index) => {
      const card = document.createElement('div');
      card.className = 'event-card';
      card.dataset.color = ev.color;
      
      card.innerHTML = `
        <div class="card-inner">
          <img src="${ev.img}" class="card-img" alt="${ev.title}">
          <div class="card-info">
            <h2 class="card-title" style="color: ${ev.color}">${ev.title}</h2>
            <p class="card-date">${ev.date}</p>
          </div>
        </div>
      `;
      deck.appendChild(card);
    });

    // GSAP ScrollTrigger Logic
    const cards = document.querySelectorAll('.event-card');

    cards.forEach((card, i) => {
      const inner = card.querySelector('.card-inner');
      const color = card.dataset.color;

      // 1. Scale down and fade card when the *next* card scrolls up over it
      if (i < cards.length - 1) {
        gsap.to(inner, {
          scale: 0.85,
          opacity: 0.3,
          ease: "none",
          scrollTrigger: {
            trigger: card,
            start: "top 15%", // When it reaches its sticky point
            end: "bottom 15%", // Over the duration of its massive margin-bottom
            scrub: true
          }
        });
      }

      // 2. Change global background glow when this card hits the sticky point
      ScrollTrigger.create({
        trigger: card,
        start: "top 40%", // Trigger color change slightly before it hits sticky
        end: "bottom 40%",
        onEnter: () => {
          glow.style.background = `radial-gradient(circle at center, ${hexToRgbA(color, 0.2)} 0%, rgba(0,0,0,0) 70%)`;
          document.body.style.boxShadow = `inset 0 0 100px ${hexToRgbA(color, 0.1)}`;
        },
        onEnterBack: () => {
          glow.style.background = `radial-gradient(circle at center, ${hexToRgbA(color, 0.2)} 0%, rgba(0,0,0,0) 70%)`;
          document.body.style.boxShadow = `inset 0 0 100px ${hexToRgbA(color, 0.1)}`;
        }
      });
    });

    // Helper for Hex to RGBA
    function hexToRgbA(hex, alpha){
      let c;
      if(/^#([A-Fa-f0-9]{3}){1,2}$/.test(hex)){
          c= hex.substring(1).split('');
          if(c.length== 3){
              c= [c[0], c[0], c[1], c[1], c[2], c[2]];
          }
          c= '0x'+c.join('');
          return 'rgba('+[(c>>16)&255, (c>>8)&255, c&255].join(',')+','+alpha+')';
      }
      return `rgba(255,255,255,${alpha})`;
    }
  </script>
</body>
</html>
